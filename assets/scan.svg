<svg width="780" height="260" viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00fff2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00fff2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="photoClip">
      <rect x="32" y="32" width="196" height="196" rx="4"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="780" height="260" rx="10" fill="#0a0e14" stroke="#1f2937" stroke-width="1"/>

  <!-- photo frame -->
  <rect x="30" y="30" width="200" height="200" rx="6" fill="#111827" stroke="#00fff2" stroke-width="1.5" opacity="0.8"/>

  <!-- REPLACE the href below with your own photo (upload it to /assets/you.png in this repo) -->
  <image x="32" y="32" width="196" height="196" clip-path="url(#photoClip)"
    href="https://avatars.githubusercontent.com/u/9919?v=4" />

  <!-- corner brackets -->
  <g stroke="#00fff2" stroke-width="2" fill="none">
    <path d="M26,46 L26,26 L46,26"/>
    <path d="M214,26 L234,26 L234,46"/>
    <path d="M26,214 L26,234 L46,234"/>
    <path d="M214,234 L234,234 L234,214"/>
  </g>

  <!-- scan line -->
  <rect x="30" width="200" height="7" fill="url(#scanGrad)" filter="url(#glow)">
    <animate attributeName="y" values="26;222;26" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- scanning label -->
  <text x="130" y="252" font-family="Consolas, Monaco, monospace" font-size="11" fill="#00fff2" text-anchor="middle" opacity="0.8">
    SCANNING
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
  </text>

  <!-- data readout -->
  <g font-family="Consolas, Monaco, monospace" font-size="16" fill="#00fff2">
    <text x="255" y="65">
      &gt; IDENTITY: ABHAY KUMAR
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.11;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="255" y="100">
      &gt; ROLE: SOFTWARE ENGINEER
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.17;0.19;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="255" y="135">
      &gt; STACK: FULL-STACK · BACKEND · CLOUD
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.27;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="255" y="170">
      &gt; FOCUS: SCALABLE SYSTEMS
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.35;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="255" y="205">
      &gt; STATUS: OPEN_TO_WORK
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.41;0.43;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="255" y="240">
      &gt; LOCATION: INDIA
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.49;0.51;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
